[package]
name = "agent-canvas-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
default-run = "agent-canvas-desktop"
description = "Local spatial workspace for coding agents, terminals, tasks and review"
repository = "https://github.com/onyxfuzzx/AgentCanvas"
publish = false
license = "MIT"

[[test]]
name = "agent_launch"
harness = false

[[test]]
name = "team_run"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
portable-pty = "0.9"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
