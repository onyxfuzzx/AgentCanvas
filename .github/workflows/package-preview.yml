name: Build preview candidates
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    name: Windows release candidate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run repo:audit -- --public
      - run: npm run native:check
      - run: npm run extension:package
      - run: npm run check
      - run: cargo install tauri-cli --version '^2' --locked
      - run: npm run desktop:release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-preview-candidates
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/windows-portable/
            artifacts/windows-portable.zip
            artifacts/windows-portable.zip.sha256
            artifacts/windows-installers/
            artifacts/*.vsix
            artifacts/*.vsix.sha256
