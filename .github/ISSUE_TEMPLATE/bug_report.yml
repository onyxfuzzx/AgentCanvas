name: Bug report
description: Report a reproducible problem with AgentCanvas.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md rather than posting details here.
        Use a disposable workspace. Remove tokens, private paths, terminal output and personal data from attachments.
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Windows desktop
        - VS Code on local Windows x64
        - Antigravity on local Windows x64
        - Browser UI development preview
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App/VSIX version or source commit, Windows version, editor version, and relevant CLI versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Start from a fresh disposable workspace and describe the smallest example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Screenshots or a short error message; never attach real workspace data or full agent transcripts.
